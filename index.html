<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AFTERLIFT — your gym in your pocket: member card with QR check-in, class booking, coach chat and workout tracking.">

  <!-- The app is carbon-dark in every system theme; declare it early to avoid a white flash. -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0e11" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0e11" media="(prefers-color-scheme: dark)">

  <!-- Installable web app (Android / desktop) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="AFTERLIFT">
  <link rel="manifest" href="manifest.json">

  <!-- iOS Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AFTERLIFT">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">

  <title>AFTERLIFT</title>

  <style>
    :root {
      color-scheme: dark;
      --carbon: #0b0e11;
      --volt: #c4f53c;
      --paper: #f2f5f7;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--carbon);
      color: var(--paper);
    }
    /* Loading screen shown until Flutter paints its first frame. */
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--carbon);
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      z-index: 1;
    }
    #loading svg {
      width: clamp(56px, 18vmin, 96px);
      height: auto;
      color: var(--volt);
      animation: gym-pulse var(--pulse-duration, 1.6s) ease-in-out infinite;
    }
    @keyframes gym-pulse {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%      { opacity: 0.55; transform: scale(0.94); }
    }
    @media (prefers-reduced-motion: reduce) {
      /* Slow the pulse rather than stop it, so it still reads as "busy". */
      #loading svg { --pulse-duration: 5s; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite" aria-label="Loading Gym App">
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <path d="M79 50 A29 29 0 1 1 66.63 26.24" fill="none" stroke="currentColor" stroke-width="12"/>
      <path d="M50 44 H85" fill="none" stroke="currentColor" stroke-width="12"/>
    </svg>
  </div>
  <script>
    // Flutter fires this on window once the first frame has rendered.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.remove(); }
    }, { once: true });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
